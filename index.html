<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage 0 瀏覽器測試台</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: auto; padding: 16px; line-height: 1.5; }
    button { font: inherit; padding: 8px 12px; }
    .meta, .summary { overflow-wrap: anywhere; padding: 10px; background: #eee4; border-radius: 6px; }
    .row { display: grid; grid-template-columns: 72px minmax(110px, 1fr) minmax(160px, 2fr) 108px; gap: 8px; align-items: start; border-bottom: 1px solid #8885; padding: 10px 0; }
    .row > span { overflow-wrap: anywhere; }
    .badge { display: inline-block; border-radius: 999px; padding: 3px 9px; font-weight: 700; text-align: center; }
    .PASS { background: #16803c; color: white; } .FAIL { background: #b32222; color: white; }
    .N-A, .EXPECTED_FAIL { background: #756d00; color: white; } .UNEXPECTED_PASS { background: #8c3d00; color: white; }
    @media (max-width: 620px) { .row { grid-template-columns: 58px 1fr; } .row > :nth-child(3), .row > :nth-child(4) { grid-column: 2; } }
  </style>
</head>
<body>
  <h1>Stage 0 瀏覽器測試台</h1>
  <p id="summary" class="summary">尚未執行。</p>
  <button id="copy-results" type="button">複製 JSON 結果</button>
  <p class="meta">userAgent：<span id="user-agent"></span><br>origin：<span id="origin"></span></p>
  <div class="row"><strong>測試</strong><strong>預期</strong><strong>實際</strong><strong>結果</strong></div>
  <main id="results"></main>
  <script type="module">
    import { EXEC_URL } from './config.local.js';
    import { runCorsMatrix } from './cors-matrix.js';
    document.querySelector('#user-agent').textContent = navigator.userAgent;
    document.querySelector('#origin').textContent = location.origin;
    const result = await runCorsMatrix(EXEC_URL);
    const host = document.querySelector('#results');
    result.tests.forEach((test) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<strong>${test.id}</strong><span>${test.expected}</span><span>${test.actual}</span><span class="badge ${test.status}">${test.status}</span>`;
      host.append(row);
    });
    document.querySelector('#summary').textContent = `通過 ${result.summary.passed}/${result.summary.total} 項；預期被瀏覽器擋下 ${result.summary.expectedFails} 項。`;
    document.querySelector('#copy-results').addEventListener('click', async () => {
      await navigator.clipboard.writeText(JSON.stringify(result, null, 2));
    });
  </script>
</body>
</html>
